
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>
    <h2>Student Information Management System</h2>

    <h3>Add Student</h3>

    <form action="/add" method="POST">
        Name:
        <input type="text" name="name" required>

        Department:
        <input type="text" name="department" required>

        <button type="submit">Add</button>
    </form>

    <hr>

    <h3>Student Records</h3>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>

            <td>
                <input
                    type="text"
                    id="name-{{ student[0] }}"
                    value="{{ student[1] }}"
                >
            </td>

            <td>
                <input
                    type="text"
                    id="dept-{{ student[0] }}"
                    value="{{ student[2] }}"
                >
            </td>

            <td>
                <button
                    type="button"
                    onclick="updateStudent({{ student[0] }})"
                >Update</button>
            </td>

            <td>
                <form action="/delete/{{ student[0] }}" method="POST">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <script>
        function updateStudent(id) {
            const name = document.getElementById("name-" + id).value;
            const department = document.getElementById("dept-" + id).value;

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/update/" + id;

            const nameInput = document.createElement("input");
            nameInput.name = "name";
            nameInput.value = name;

            const deptInput = document.createElement("input");
            deptInput.name = "department";
            deptInput.value = department;

            form.appendChild(nameInput);
            form.appendChild(deptInput);
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
